<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectHub — AI Project Management Platform</title>
<meta name="description" content="ProjectHub — a working project management platform demo: Kanban, sprints, Gantt timeline, risk tracking, team roles, KPI dashboard, and an AI meeting-summary tool.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============== LOGIN SCREEN ============== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">PH</span>
      <span class="brand-name">ProjectHub</span>
    </div>
    <h1>Welcome back</h1>
    <p class="login-sub">Sign in to your team workspace.</p>

    <div id="login-error" class="login-error" hidden></div>

    <form id="login-form" class="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@company.com" autocomplete="username">

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">

      <button type="submit" class="btn-primary btn-full">Sign In</button>
    </form>

    <button id="demo-login-btn" class="login-demo">Use demo account →</button>

    <p class="login-footnote">
      This is a client-only portfolio demo — there's no real backend or account
      system. Any email/password signs you in, or use the demo account button.
      All data lives in your browser's local storage.
    </p>
  </div>
</div>

<!-- ============== APP SHELL (built by app.js) ============== -->
<div id="app-shell" hidden></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/kanban.js"></script>
<script src="js/sprints.js"></script>
<script src="js/gantt.js"></script>
<script src="js/risks.js"></script>
<script src="js/team.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/ai-generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
