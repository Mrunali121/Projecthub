<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="560" fill="#F2F4F1"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="560" fill="#14213D"/>
  <rect x="20" y="24" width="24" height="24" rx="5" fill="#0E8F7E"/>
  <text x="52" y="41" fill="#FFFFFF" font-size="14" font-weight="bold">ProjectHub</text>

  <rect x="16" y="76" width="148" height="34" rx="5" fill="#0E8F7E"/>
  <text x="30" y="97" fill="#FFFFFF" font-size="11">Dashboard</text>
  <text x="30" y="132" fill="#B8C0D4" font-size="11">Kanban Board</text>
  <text x="30" y="164" fill="#B8C0D4" font-size="11">Sprint Planning</text>
  <text x="30" y="196" fill="#B8C0D4" font-size="11">Gantt Timeline</text>
  <text x="30" y="228" fill="#B8C0D4" font-size="11">Risks &amp; Issues</text>
  <text x="30" y="260" fill="#B8C0D4" font-size="11">Team &amp; Roles</text>
  <text x="30" y="292" fill="#B8C0D4" font-size="11">AI Tools</text>

  <!-- Topbar -->
  <rect x="180" y="0" width="780" height="56" fill="#FFFFFF" stroke="#D4D9D6" stroke-width="1"/>
  <text x="204" y="34" fill="#14213D" font-size="15" font-weight="bold">Dashboard</text>
  <circle cx="900" cy="28" r="14" fill="#0E8F7E"/>
  <text x="900" y="32" fill="#FFFFFF" font-size="10" text-anchor="middle" font-weight="bold">MR</text>

  <!-- KPI cards -->
  <g>
    <rect x="204" y="80" width="168" height="76" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
    <text x="220" y="104" fill="#5B6472" font-size="10">Open Tasks</text>
    <text x="220" y="134" fill="#14213D" font-size="24" font-weight="bold">11</text>

    <rect x="384" y="80" width="168" height="76" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
    <text x="400" y="104" fill="#5B6472" font-size="10">Sprint Progress</text>
    <text x="400" y="134" fill="#14213D" font-size="24" font-weight="bold">54%</text>

    <rect x="564" y="80" width="168" height="76" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
    <text x="580" y="104" fill="#5B6472" font-size="10">Avg. Velocity</text>
    <text x="580" y="134" fill="#14213D" font-size="24" font-weight="bold">22 pts</text>

    <rect x="744" y="80" width="192" height="76" rx="6" fill="#FFFBF3" stroke="#E2963A"/>
    <text x="760" y="104" fill="#92400e" font-size="10">Open Risks</text>
    <text x="760" y="134" fill="#14213D" font-size="24" font-weight="bold">4</text>
  </g>

  <!-- Kanban strip -->
  <text x="204" y="192" fill="#14213D" font-size="13" font-weight="bold">Kanban Board</text>
  <g font-size="9">
    <!-- Backlog -->
    <rect x="204" y="204" width="176" height="150" rx="6" fill="#E7EAE6"/>
    <text x="216" y="222" fill="#14213D" font-size="10" font-weight="bold">Backlog</text>
    <rect x="214" y="232" width="156" height="38" rx="4" fill="#FFFFFF" stroke="#D4D9D6"/>
    <rect x="214" y="276" width="156" height="38" rx="4" fill="#FFFFFF" stroke="#D4D9D6"/>

    <!-- In Progress -->
    <rect x="392" y="204" width="176" height="150" rx="6" fill="#E7EAE6"/>
    <text x="404" y="222" fill="#14213D" font-size="10" font-weight="bold">In Progress</text>
    <rect x="402" y="232" width="156" height="38" rx="4" fill="#FFFFFF" stroke="#E2963A"/>
    <rect x="402" y="276" width="156" height="38" rx="4" fill="#FFFFFF" stroke="#D4D9D6"/>

    <!-- QA -->
    <rect x="580" y="204" width="176" height="150" rx="6" fill="#E7EAE6"/>
    <text x="592" y="222" fill="#14213D" font-size="10" font-weight="bold">QA</text>
    <rect x="590" y="232" width="156" height="38" rx="4" fill="#FFFFFF" stroke="#3B6FA0"/>

    <!-- Done -->
    <rect x="768" y="204" width="168" height="150" rx="6" fill="#E7EAE6"/>
    <text x="780" y="222" fill="#14213D" font-size="10" font-weight="bold">Done</text>
    <rect x="778" y="232" width="148" height="38" rx="4" fill="#FFFFFF" stroke="#0E8F7E"/>
    <rect x="778" y="276" width="148" height="38" rx="4" fill="#FFFFFF" stroke="#0E8F7E"/>
    <rect x="778" y="320" width="148" height="24" rx="4" fill="#FFFFFF" stroke="#0E8F7E"/>
  </g>

  <!-- Chart strip -->
  <rect x="204" y="380" width="368" height="150" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
  <text x="220" y="404" fill="#5B6472" font-size="10">Tasks by Status</text>
  <rect x="240" y="440" width="30" height="60" fill="#5B6472"/>
  <rect x="290" y="460" width="30" height="40" fill="#E2963A"/>
  <rect x="340" y="470" width="30" height="30" fill="#14213D"/>
  <rect x="390" y="420" width="30" height="80" fill="#0E8F7E"/>

  <rect x="588" y="380" width="348" height="150" rx="6" fill="#FFFFFF" stroke="#D4D9D6"/>
  <text x="604" y="404" fill="#5B6472" font-size="10">Velocity Trend</text>
  <polyline points="620,470 680,455 740,460 800,430" fill="none" stroke="#0E8F7E" stroke-width="2.5"/>
  <circle cx="620" cy="470" r="3" fill="#0E8F7E"/><circle cx="680" cy="455" r="3" fill="#0E8F7E"/>
  <circle cx="740" cy="460" r="3" fill="#0E8F7E"/><circle cx="800" cy="430" r="3" fill="#0E8F7E"/>
</svg>
